<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form powered by an AWS serverless backend.">
    <title>Serverless Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="icon" aria-hidden="true">✉️</div>

        <h1>Get in Touch</h1>

        <p class="subtitle">
            Have a question or feedback? Send us a message.
            We'll receive your message through our serverless backend.
        </p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    maxlength="254"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    minlength="5"
                    maxlength="5000"
                    required
                ></textarea>
            </div>

            <button type="submit" id="submitBtn">Send Message</button>
            <div id="status" role="status" aria-live="polite" hidden></div>
        </form>

        <div class="footer">
            <!-- Powered by <span>AWS Lambda</span> &amp; DynamoDB -->
        </div>
    </main>
</body>
</html>
