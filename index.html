
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #eef2ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
        }

        .icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            background: #dbeafe;
            border-radius: 14px;
            font-size: 28px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #status {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 9px;
            overflow-wrap: anywhere;
            font-size: 14px;
            line-height: 1.5;
        }

        #status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        .footer span {
            color: #2563eb;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="icon" aria-hidden="true">✉️</div>

        <h1>Get in Touch</h1>

        <p class="subtitle">
            Have a question or feedback? Send us a message.
            We'll receive your message through our serverless backend.
        </p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    maxlength="254"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    minlength="5"
                    maxlength="5000"
                    required
                ></textarea>
            </div>

            <button type="submit" id="submitBtn">
                Send Message
            </button>

            <div id="status" role="status" aria-live="polite"></div>
        </form>

        <div class="footer">
            Powered by <span>AWS Lambda</span> &amp; DynamoDB
        </div>
    </main>

    <script>
        const API_URL =
            "https://2582xx3bzl.execute-api.us-east-1.amazonaws.com/dev/contacts";

        const form = document.getElementById("contactForm");
        const submitBtn = document.getElementById("submitBtn");
        const statusBox = document.getElementById("status");

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                message: document.getElementById("message").value.trim()
            };

            if (
                !formData.name ||
                !formData.email ||
                formData.message.length < 5
            ) {
                showStatus(
                    "Please enter your name, a valid email, and a message of at least 5 characters.",
                    "error"
                );
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";
            statusBox.className = "";
            statusBox.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                // REST API with Lambda proxy integration may return
                // the Lambda response inside a JSON object.
                let lambdaResult = result;

                if (typeof result.body === "string") {
                    try {
                        lambdaResult = JSON.parse(result.body);
                    } catch {
                        lambdaResult = result;
                    }
                }

                const lambdaStatus = Number(result.statusCode);

                if (
                    response.ok &&
                    (!Number.isFinite(lambdaStatus) || lambdaStatus < 400) &&
                    !lambdaResult.error
                ) {
                    showStatus(
                        lambdaResult.message ||
                        "Your message was submitted successfully!",
                        "success"
                    );

                    form.reset();
                } else {
                    showStatus(
                        lambdaResult.error ||
                        "Unable to send your message. Please try again.",
                        "error"
                    );
                }

            } catch (error) {
                console.error("Contact form request failed:", error);

                showStatus(
                    "Could not connect to the API. Please check your connection and API CORS settings.",
                    "error"
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Message";
            }
        });
    </script>

</body>
</html>
